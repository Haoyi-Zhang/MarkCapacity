name: P031 private full source-package
on:
  push:
    branches:
      - internal/p031-source-export-1dee479fc947
permissions:
  contents: read
jobs:
  complete-source-export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      P031_ARCHIVE_SHA256: 1dee479fc94721a23b46c5e4ad4875ebbd6f858cb4602d53d06b77ac19d95057
    steps:
      - name: Require the approved private repository and exact internal branch
        shell: bash
        env:
          REPOSITORY_IS_PRIVATE: ${{ github.event.repository.private }}
          REPOSITORY_ID: ${{ github.event.repository.id }}
          REPOSITORY_FULL_NAME: ${{ github.repository }}
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_IS_PRIVATE" = true
          test "$REPOSITORY_ID" = 1385799778
          test "$REPOSITORY_FULL_NAME" = Haoyi-Zhang/MarkCapacity
          test "$CURRENT_REF" = refs/heads/internal/p031-source-export-1dee479fc947
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 3
      - name: Require exact source lineage and a workflow-only repair
        shell: bash
        run: |
          set -euo pipefail
          source=b6a66600b376d1b64d5be68e2d8dc7db47619de0
          validation=31ca4def298ae5101ce226d00bc0ad36ece73cd5
          workflow=.github/workflows/p031-internal-source-export.yml
          audit=.github/scripts/P031-private-source-package-audit.py
          archive=private-distribution/P031-source-export.tar
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-list --parents -n 1 HEAD)" = "$GITHUB_SHA $validation"
          test "$(git rev-list --parents -n 1 "$validation")" = "$validation $source"
          test "$(git rev-parse "$source^{tree}")" = 877a44d0e8ba2e6ce92f6be3d9d2780050d0de00
          test "$(git rev-parse "$validation^{tree}")" = 08cbf796a0c7d7d5afb09864c488a30db29af343
          expected="$(printf 'A\t%s\nA\t%s\nA\t%s' "$audit" "$workflow" "$archive")"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$source" "$validation")" = "$expected"
          test "$(git ls-tree "$validation" -- "$audit")" = "$(printf '100644 blob %s\t%s' 07c1e1fc9d178bc2fd7b3cd2d05f270ff8eb0a48 "$audit")"
          test "$(git ls-tree "$validation" -- "$archive")" = "$(printf '100644 blob %s\t%s' f73a98b224336b6ede501cd1535ad25e4fad8542 "$archive")"
          test "$(git ls-tree "$validation" -- "$workflow")" = "$(printf '100644 blob %s\t%s' a9bc652082acfed6a5f14a476972eead21bb6b3f "$workflow")"
          test "$(git diff-tree --no-commit-id --name-status --no-renames -r "$validation" HEAD)" = "$(printf 'M\t%s' "$workflow")"
          read -r mode kind object path <<< "$(git ls-tree HEAD -- "$workflow")"
          test "$mode $kind $path" = "100644 blob $workflow"
          for directory in .github .github/workflows; do
            read -r mode kind object path <<< "$(git ls-tree HEAD -- "$directory")"
            test "$mode $kind $path" = "040000 tree $directory"
          done
          protected_inventory() {
            local listing record
            listing="$(git ls-tree -r -t "$1")" || return 1
            while IFS= read -r record; do
              case "${record#*$'\t'}" in
                "$workflow"|.github|.github/workflows) ;;
                *) printf '%s\n' "$record" ;;
              esac
            done <<< "$listing"
          }
          before="$(protected_inventory "$validation")"
          after="$(protected_inventory HEAD)"
          test "$before" = "$after"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the embedded clean source package
        shell: bash
        env:
          P031_CHECK_LOGS: ${{ runner.temp }}/p031-source-package-checks
        run: |
          set -euo pipefail
          test ! -e "$P031_CHECK_LOGS"
          mkdir "$P031_CHECK_LOGS"
          for tool in python3 tar pdfinfo pdftotext timeout; do
            command -v "$tool" >/dev/null || { printf 'Missing existing tool: %s\n' "$tool" >&2; exit 2; }
          done
          ulimit -v 2097152
          ulimit -t 600
          archive="$GITHUB_WORKSPACE/private-distribution/P031-source-export.tar"
          audit="$GITHUB_WORKSPACE/.github/scripts/P031-private-source-package-audit.py"
          python3 -B "$audit" --archive "$archive" --expected-sha256 "$P031_ARCHIVE_SHA256" > "$P031_CHECK_LOGS/archive.json"
          fresh="$(mktemp -d "$RUNNER_TEMP/p031-source-export.XXXXXX")"
          tar --extract --file="$archive" --directory="$fresh" --same-permissions --no-same-owner
          root="$fresh/P031"
          python3 -B "$audit" --archive "$archive" --expected-sha256 "$P031_ARCHIVE_SHA256" --extracted-root "$root" > "$P031_CHECK_LOGS/before.json"
          status=0
          (cd "$root/artifact" && timeout --kill-after=10s 600s ./run-current-export-checks.sh) > "$P031_CHECK_LOGS/full-source-export.log" 2>&1 || status=$?
          printf '%s\n' "$status" > "$P031_CHECK_LOGS/exit-status.txt"
          python3 -B "$audit" --archive "$archive" --expected-sha256 "$P031_ARCHIVE_SHA256" --extracted-root "$root" > "$P031_CHECK_LOGS/after.json"
          cmp "$P031_CHECK_LOGS/before.json" "$P031_CHECK_LOGS/after.json"
          cat "$P031_CHECK_LOGS/full-source-export.log"
          exit "$status"
      - name: Retain source-package output even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p031-private-complete-source-export
          path: ${{ runner.temp }}/p031-source-package-checks/
          if-no-files-found: warn
          retention-days: 14
